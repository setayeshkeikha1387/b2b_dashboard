name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dashboard_test_db
          POSTGRES_USER: dashboard_user
          POSTGRES_PASSWORD: dashboard_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard_user -d dashboard_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 apps config
        continue-on-error: true

      - name: Check formatting (black)
        run: black --check apps config
        continue-on-error: true

      - name: Run migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgres://dashboard_user:dashboard_password@localhost:5432/dashboard_test_db
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgres://dashboard_user:dashboard_password@localhost:5432/dashboard_test_db
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t b2b-dashboard:ci .
