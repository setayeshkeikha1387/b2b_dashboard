{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Edit Task{% else %}New Task{% endif %}{% endblock %}
{% block content %}
<h3 class="mb-3">{% if object %}Edit Task{% else %}New Task{% endif %}</h3>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'tasks:task_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
