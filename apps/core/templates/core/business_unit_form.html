{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Edit{% else %}New{% endif %} Business Unit{% endblock %}
{% block content %}
<h3 class="mb-3">{% if object %}Edit{% else %}New{% endif %} Business Unit</h3>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'core:business_unit_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
