{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h4 class="card-title">Delete "{{ object }}"?</h4>
        <p class="text-muted">This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{{ request.META.HTTP_REFERER|default:'javascript:history.back()' }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
